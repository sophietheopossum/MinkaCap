[package]
name = "MinkaCap"
version = "0.1.0"
edition = "2021"
description = "Per-window Wayland capture for MinkaDE: occlusion-free toplevel screenshots via ext-image-copy-capture"

# A library: MinkaDE's one binary (minka/, at the top of the checkout) runs it
# under the name it was started as. Nothing is built from here alone.
[lib]
name = "minka_cap"
path = "src/lib.rs"
doctest = false

[dependencies]
# MinkaDE's log line (minka-note/, at the top of the checkout): one write(2) each.
minka-note = { path = "../minka-note" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
rustix = { version = "0.38", features = ["fs", "mm"] }
png = "0.17"
